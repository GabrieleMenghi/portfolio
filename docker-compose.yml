# Sul VPS, in /srv/portfolio. Come Razor, non pubblica porte: entra solo il Caddy
# condiviso (/srv/proxy), che raggiunge il sito sulla rete "proxy" come portfolio:3000.
name: portfolio

services:
  web:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    networks:
      proxy:
        aliases: [portfolio]

networks:
  proxy:
    external: true
